# =======================================================
# CoursePath: Academic Prerequisite & Course Planning System
# Application Configuration
# =======================================================

server.port=8080

# Application Name
spring.application.name=coursepath-backend

# -------------------------------------------------------
# Default Database Configuration: H2 Embedded Database
# (Zero setup needed - works immediately upon extraction!)
# -------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:coursepathdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------
# Optional MySQL Configuration
# (Uncomment the lines below if you prefer local MySQL)
# -------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/coursepath_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security & CORS settings
coursepath.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
